# Capacity knob: the pod's CPU limit is 500m (chart app.shared.resources) and `auto`
# counts node cores, not the cgroup limit. Raise to 4 if services.ui is given 2000m.
worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $uri, not $request: query strings carry enrollment tokens and OIDC codes, so they never reach the access log.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    client_max_body_size 10m;
    sendfile on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 1;

    # Hostnames are the chart's Service names (charts/telark/templates/_service.tpl), baked at image build.
    # keepalive_timeout stays below the backends' 120s IdleTimeout so nginx always closes first.
    upstream exporter_api   { server telark-exporter-service:8080;   keepalive 32; keepalive_requests 100; keepalive_timeout 60s; }
    upstream discovery_api  { server telark-discovery-service:8080;  keepalive 32; keepalive_requests 100; keepalive_timeout 60s; }
    upstream auth_api       { server telark-auth-service:8080;       keepalive 32; keepalive_requests 100; keepalive_timeout 60s; }
    # analyzer is uvicorn with its default 5s idle close, so its pool must expire first.
    upstream analyzer_api   { server telark-analyzer-service:8080;   keepalive 16; keepalive_requests 100; keepalive_timeout 3s; }

    # proxy_set_header replaces, never merges: one proxy_set_header inside a location drops all of these for it.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Identity headers are set only by in-cluster callers; an empty value drops any a browser sends.
    proxy_set_header X-Service-Token "";
    proxy_set_header X-User-ID "";
    proxy_set_header X-Username "";
    proxy_set_header X-Email "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 64 32k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 32m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # style-src needs 'unsafe-inline' for antd's CSS-in-JS; HSTS belongs at the TLS terminator (README).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self' https://accounts.google.com" always;

        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self' https://accounts.google.com" always;
        }

        location = /index.html {
            expires -1;
        }

        # Enroll links carry their token in the query, so this page sends no Referer. add_header here replaces
        # the server's full set, and try_files serves the SPA in place: a redirect would drop these headers.
        location = /register {
            expires -1;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self' https://accounts.google.com" always;
            try_files /index.html =404;
        }

        # Service-to-service routes are never reachable from the browser.
        location ~ ^/api/[a-z]+/api/v1/internal/ {
            return 404;
        }

        location /api/exporter/ {
            proxy_pass http://exporter_api/;
        }

        location /api/discovery/ {
            proxy_pass http://discovery_api/;
            proxy_read_timeout 60s;
        }

        location /api/auth/ {
            proxy_pass http://auth_api/;
        }

        location /api/analyzer/ {
            proxy_pass http://analyzer_api/;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
